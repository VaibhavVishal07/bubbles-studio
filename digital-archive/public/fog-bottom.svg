<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="1600" height="480" preserveAspectRatio="none">
  <defs>
    <filter id="smoke" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0045 0.008" numOctaves="5" seed="19" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="170" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="haze" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.007 0.012" numOctaves="4" seed="5" result="n" />
      <feDisplacementMap in="SourceGraphic" in2="n" scale="110" xChannelSelector="R" yChannelSelector="G" />
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#43180a" />
      <stop offset="35%" stop-color="#2b0d04" />
      <stop offset="70%" stop-color="#150501" />
      <stop offset="100%" stop-color="#0a0200" />
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0" />
      <stop offset="28%" stop-color="#fff" stop-opacity="0.28" />
      <stop offset="52%" stop-color="#fff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fff" stop-opacity="1" />
    </linearGradient>

    <mask id="feather">
      <rect width="1600" height="480" fill="url(#fade)" />
    </mask>
  </defs>

  <g mask="url(#feather)">
    <rect x="0" y="0" width="1600" height="480" fill="url(#ground)" />

    <g filter="url(#smoke)" fill="#200802">
      <ellipse cx="200" cy="215" rx="300" ry="130" />
      <ellipse cx="720" cy="185" rx="360" ry="145" />
      <ellipse cx="1240" cy="220" rx="330" ry="130" />
      <ellipse cx="1560" cy="245" rx="240" ry="115" />
    </g>

    <g filter="url(#haze)" fill="#8a5b3d" opacity="0.34">
      <ellipse cx="480" cy="230" rx="240" ry="62" />
      <ellipse cx="1060" cy="205" rx="260" ry="56" />
    </g>
  </g>
</svg>
